name: Refresh public MND reports
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1,5,9 * * *'
permissions:
  contents: write
concurrency:
  group: mnd-reports
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 只有把示意圖的紅色標註向量化需要這兩個套件；缺少時 extract_areas() 會回傳
      # None，數值通報照常發布，不會讓整個工作流程失敗
      - name: Install chart vectorisation dependencies
        run: python3 -m pip install --quiet 'pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Fetch and validate official reports
        run: python3 scripts/update_mnd_activity.py
      - name: Publish report snapshot
        run: |
          git add data/mnd_activity.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh public MND activity reports'
          git pull --rebase origin main
          git push origin HEAD:main
