name: Refresh public MND reports
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1,5,9 * * *'
permissions:
  contents: write
concurrency:
  group: mnd-reports
  cancel-in-progress: false
jobs:
  refresh:
    # 釘死版本而非用 ubuntu-latest：該標籤在 2026-10-19 起會滾動到 Ubuntu 26，
    # 這個工作流程會 pip install pillow/numpy，映像換版就可能靜默改變輪子版本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v5 起執行於 Node 24；v4 的 Node 20 已被 runner 強制升級並發出棄用警告
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # 只有把示意圖的紅色標註向量化需要這兩個套件；缺少時 extract_areas() 會回傳
      # None，數值通報照常發布，不會讓整個工作流程失敗
      - name: Install chart vectorisation dependencies
        run: python3 -m pip install --quiet 'pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Fetch and validate official reports
        run: python3 scripts/update_mnd_activity.py
      - name: Publish report snapshot
        run: |
          git add data/mnd_activity.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh public MND activity reports'
          git pull --rebase origin main
          git push origin HEAD:main
